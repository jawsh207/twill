name: Build installable APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Sign every test build with the same key so new APKs install as updates over old ones.
      # This key is for test builds only; real releases use a private key kept out of the repo.
      - name: Use the shared test signing key
        run: |
          mkdir -p ~/.android
          cp .github/ci/debug.keystore ~/.android/debug.keystore

      - name: Assemble optimized test APK (perf)
        run: ./gradlew :app:assemblePerf --no-daemon --stacktrace --console=plain

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: twill-apk
          path: app/build/outputs/apk/perf/*.apk
          if-no-files-found: error

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: twill-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
