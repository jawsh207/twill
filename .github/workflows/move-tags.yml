name: Move release tags

# One-off: points the release tags at the rewritten commits. Removed after it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Force-push the tags
        run: |
          git push -f origin \
            b78f0a3940a16591532c18163f51202dc5ff95f8:refs/tags/v1.0.0 \
            3f205571a81e5ea153dabc1ed173894e5451253c:refs/tags/v1.0.1 \
            ac7037f5126e6133c481e5def30fa42366e68f3e:refs/tags/v1.0.2 \
            72a63600e56acc43cd22a643dde2b776ad0d4c3f:refs/tags/v1.0.3 \
            11f8e8c112dd89e845a1798bce259201365997bd:refs/tags/v1.0.4 \
            47e990e89c282f739b5b88dad66ce9d40ffcbf7d:refs/tags/v1.0.5 \
            506ed05c2e0b5e6e213256d194ef812df76a8e5b:refs/tags/v1.0.6 \
            49fcc6c64c003c83d25d203b95af04412555300b:refs/tags/v1.0.7 \
            af0dad2fc72696a8cc2b0a16d5ce982836247b49:refs/tags/v1.0.8 \
