name: Release

# Builds the real release APK (app.twill.messages), signed with the private release key, and publishes
# it as a GitHub release tagged v<versionName>. Run it from the Actions tab (Run workflow).
#
# The key lives only in these repository secrets (Settings > Secrets and variables > Actions):
#   TWILL_KEYSTORE_BASE64  the keystore file, base64-encoded
#   TWILL_KEYSTORE_PASSWORD
#   TWILL_KEY_ALIAS
#   TWILL_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check the release key is set up
        env:
          KEYSTORE: ${{ secrets.TWILL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TWILL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TWILL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWILL_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing TWILL_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing TWILL_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing TWILL_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing TWILL_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Release key not set up::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Work out the version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          [ -n "$name" ] || { echo "::error::versionName not found"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          # What's new: this version's section of CHANGELOG.md ("## <version>" up to the next "## ").
          awk -v v="$name" '$0 == "## " v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md \
            | sed -e '/./,$!d' > changelog-section.md
          if ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "::error title=No changelog::Add a '## $name' section to CHANGELOG.md before releasing."
            exit 1
          fi
          if gh release view "v$name" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Version already released::v$name exists. Bump versionCode and versionName in app/build.gradle.kts first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Same core and cache as build-apk.yml.
      - name: Restore Delta Chat core
        id: deltachat-cache
        uses: actions/cache/restore@v4
        with:
          path: deltachat
          key: deltachat-core-${{ hashFiles('scripts/build-deltachat-core.sh', 'native/deltachat/**') }}

      - name: Build Delta Chat core
        if: steps.deltachat-cache.outputs.cache-hit != 'true'
        run: scripts/build-deltachat-core.sh

      - name: Save Delta Chat core
        if: steps.deltachat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deltachat
          key: deltachat-core-${{ hashFiles('scripts/build-deltachat-core.sh', 'native/deltachat/**') }}

      - name: Require the Delta Chat core
        run: test -f deltachat/jniLibs/arm64-v8a/libtwill_deltachat.so

      # The key is written only for this job's workspace and removed at the end.
      - name: Install the release key
        env:
          KEYSTORE: ${{ secrets.TWILL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TWILL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TWILL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWILL_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release APK
        run: .github/ci/gradle-report-errors.sh :app:assembleRelease --no-daemon --console=plain

      - name: Check the signature
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apksigner="$tools/apksigner"
          package=$("$tools/aapt2" dump packagename "$apk")
          [ "$package" = app.twill.messages ] || { echo "::error::Package is $package, expected app.twill.messages"; exit 1; }
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "CN=Android Debug" certs.txt && { echo "::error::Signed with a debug key"; exit 1; }
          sha=$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1)
          out="twill-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release certificate SHA-256::$sha"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="${{ steps.apk.outputs.file }}"
          sha256sum "$file" > "$file.sha256"
          {
            echo "## What's new"
            echo
            cat changelog-section.md
            echo
            echo "---"
            echo
            echo "Twill ${{ steps.version.outputs.name }} (\`app.twill.messages\`, arm64). Installs alongside the system Messaging app."
            echo
            echo "Signing certificate SHA-256: \`${{ steps.apk.outputs.sha }}\`"
          } > notes.md
          gh release create "${{ steps.version.outputs.tag }}" "$file" "$file.sha256" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Twill ${{ steps.version.outputs.name }}" --notes-file notes.md

      - name: Remove the release key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"
